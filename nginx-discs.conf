server {
    listen 80;
    listen [::]:80;
    server_name discs.baselinetech.ie;

    root /var/www/trophy-disc-printer;
    index index.html;

    # certbot --nginx adds the 443 block and the HTTP->HTTPS redirect

    location / {
        try_files $uri $uri/ =404;
    }

    # The page and the service worker must never be served stale, or installed
    # copies won't see updates. Everything else is versioned by sw.js's cache name.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { types { } default_type application/manifest+json; add_header Cache-Control "no-cache"; }

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;
}
